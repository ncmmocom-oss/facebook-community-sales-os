name: Security Regression Gate

on:
  pull_request:
    paths:
      - 'apps-script/**'
      - 'bootstrap/**'
      - 'worker-keeper/**'
      - '.github/workflows/security-regression.yml'
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - 'bootstrap/**'
      - 'worker-keeper/**'
      - '.github/workflows/security-regression.yml'

permissions:
  contents: read

jobs:
  scan-scope-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          cp apps-script/Runtime.js /tmp/runtime.js
          node --check /tmp/runtime.js
          cp bootstrap/Code.gs /tmp/bootstrap.js
          node --check /tmp/bootstrap.js
          node --check worker-keeper/background.js
          node --check worker-keeper/content.js
          node --check worker-keeper/popup.js

      - name: Execute Context/Identity acceptance harness
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          let src=fs.readFileSync('apps-script/Runtime.js','utf8');
          src += '\n;globalThis.__remoteApp = RemoteApp;';
          const propsStore={};
          const props={
            getProperty:k=>Object.prototype.hasOwnProperty.call(propsStore,k)?propsStore[k]:null,
            setProperty:(k,v)=>{propsStore[k]=String(v);},
            deleteProperty:k=>{delete propsStore[k];},
            getProperties:()=>Object.assign({},propsStore)
          };
          let uuidSeq=0;
          const sandbox={
            console,
            PropertiesService:{getDocumentProperties:()=>props},
            LockService:{getDocumentLock:()=>({tryLock:()=>true,releaseLock:()=>{}})},
            Utilities:{
              getUuid:()=>('ci-uuid-'+(++uuidSeq)),
              base64EncodeWebSafe:v=>Buffer.from(String(v),'utf8').toString('base64url'),
              Charset:{UTF_8:'UTF-8'}
            }
          };
          vm.createContext(sandbox);
          vm.runInContext(src,sandbox,{timeout:5000});
          const r=sandbox.__remoteApp.runContextIntegrityHarness();
          console.log(JSON.stringify(r,null,2));
          if(!r || r.ok!==true) process.exit(1);
          const required=[
            'T01_GARBAGE_CONTEXT',
            'T02_MISSING_CTA',
            'T03_FULL_SEVEN_FIELDS',
            'T04_GLOBAL_CONTEXT_ISOLATION',
            'ID_NUMERIC_SAFE_INTEGER',
            'ID_SCIENTIFIC_DISPLAY_REJECTED',
            'ID_PRODUCT_SERVICE_EXACT',
            'SALES_NONPASS_NEW_BLOCKED',
            'SALES_PASS_NEW_ALLOWED',
            'SALES_ENTRY_ONLY_QUALIFIED',
            'SALES_SEQUENCE_FORWARD_ONLY',
            'SALES_SKIP_BLOCKED',
            'SALES_SAME_STAGE_IDEMPOTENT',
            'SALES_TERMINAL_LOCKED',
            'SALES_TERMINAL_CLEARS_FOLLOWUP',
            'SHEET_CAPACITY_ERROR_TRANSIENT'
          ];
          for(const k of required){
            if(r.tests[k]!==true) throw new Error('acceptance failed: '+k);
          }
          const p=sandbox.__remoteApp.runProviderResilienceHarness();
          console.log(JSON.stringify(p,null,2));
          if(!p || p.ok!==true) process.exit(1);
          const providerRequired=[
            'TRANSIENT_HTTP_CODES','TRANSIENT_TEXT_HIGH_DEMAND','TRANSIENT_TEXT_RATE_LIMIT',
            'GEMINI_TO_OPENAI','OPENAI_TO_GEMINI','NO_SECOND_PROVIDER_FAIL_CLOSED','NON_TRANSIENT_NO_FAILOVER'
          ];
          for(const k of providerRequired){
            if(p.tests[k]!==true) throw new Error('provider acceptance failed: '+k);
          }
          const g=sandbox.__remoteApp.runGroupSummaryCardinalityHarness();
          console.log(JSON.stringify(g,null,2));
          if(!g || g.ok!==true) process.exit(1);
          const groupSummaryRequired=[
            'GROUP_SUMMARY_ACTIVE_INACTIVE_ONE_ROW',
            'GROUP_SUMMARY_ALIAS_COMPONENT_ONE_ROW',
            'GROUP_SUMMARY_KPI_NOT_MULTIPLIED',
            'GROUP_SUMMARY_ACTIVE_METADATA_WINS',
            'GROUP_SUMMARY_IDENTITY_MISSING_FAIL_CLOSED',
            'GROUP_SUMMARY_INACTIVE_ONLY_RETAINED'
          ];
          for(const k of groupSummaryRequired){
            if(g.tests[k]!==true) throw new Error('group summary acceptance failed: '+k);
          }
          const gc=sandbox.__remoteApp.runGroupRegistryCleanupHarness();
          console.log(JSON.stringify(gc,null,2));
          if(!gc || gc.ok!==true) process.exit(1);
          const gd=sandbox.__remoteApp.runGroupDisplayInvariantHarness();
          console.log(JSON.stringify(gd,null,2));
          if(!gd || gd.ok!==true) process.exit(1);
          for(const k of ['DISPLAY_EMPTY_PLACEHOLDER','DISPLAY_NUMERIC_PLACEHOLDER','DISPLAY_SLUG_PLACEHOLDER','DISPLAY_REAL_TITLE_PRESERVED','ALIAS_SCIENTIFIC_REJECTED_BY_ID_RULE']){
            if(gd.tests[k]!==true) throw new Error('group display acceptance failed: '+k);
          }
          const groupCleanupRequired=[
            'REGISTRY_ONE_CANONICAL_ROW',
            'REGISTRY_DUPLICATE_DELETE_ONLY',
            'REGISTRY_ACTIVE_REPRESENTATIVE',
            'REGISTRY_NUMERIC_ALIAS_PRESERVED',
            'REGISTRY_SLUG_ALIAS_PRESERVED'
          ];
          for(const k of groupCleanupRequired){
            if(gc.tests[k]!==true) throw new Error('group registry cleanup acceptance failed: '+k);
          }
          const onboarding=sandbox.__remoteApp.runGroupOnboardingHarness();
          console.log(JSON.stringify(onboarding,null,2));
          if(!onboarding || onboarding.ok!==true) process.exit(1);
          const onboardingRequired=[
            'ONBOARD_URL_NORMALIZED',
            'ONBOARD_NON_GROUP_REJECTED',
            'ONBOARD_REAL_TITLE_ONLY',
            'ONBOARD_PLACEHOLDER',
            'DISCOVERY_NO_OFFER_INFERENCE',
            'DISCOVERY_NO_POSTS_DAY_INFERENCE'
          ];
          for(const k of onboardingRequired){
            if(onboarding.tests[k]!==true) throw new Error('group onboarding acceptance failed: '+k);
          }
          const intel=sandbox.__remoteApp.runGroupIntelligenceHarness();
          console.log(JSON.stringify(intel,null,2));
          if(!intel || intel.ok!==true) process.exit(1);
          for(const k of [
            'INTEL_RELEVANT_OBSERVED','INTEL_BUYER_SIGNAL_OBSERVED','INTEL_LEAD_YIELD_OBSERVED',
            'INTEL_COMMENT_DAY_OBSERVED','INTEL_FIT_REQUIRES_CONTEXT','INTEL_ACTIVITY_INCOMPLETE_IS_BLANK'
          ]){
            if(intel.tests[k]!==true) throw new Error('group intelligence acceptance failed: '+k);
          }
          const native=sandbox.__remoteApp.runApiNativeCleanupHarness();
          console.log(JSON.stringify(native,null,2));
          if(!native || native.ok!==true) process.exit(1);
          for(const k of ['API_NATIVE_WRAPPER_EXISTS','API_NATIVE_NO_SERIALIZE','LEGACY_JSON_PARSE_RETAINED','PARSED_PAYLOAD_SUPPORTED']){
            if(native.tests[k]!==true) throw new Error('API native acceptance failed: '+k);
          }
          const identity=sandbox.__remoteApp.runVerifiedIdentityRetryHarness();
          console.log(JSON.stringify(identity,null,2));
          if(!identity || identity.ok!==true) process.exit(1);
          for(const k of ['ID_RETRY_VERIFIED_NUMERIC','ID_RETRY_NO_NUMERIC_BLOCKED','ID_RETRY_NON_IDENTITY_BLOCKED','ID_RETRY_SAME_CANONICAL_BLOCKED']){
            if(identity.tests[k]!==true) throw new Error('identity retry acceptance failed: '+k);
          }
          const policy=sandbox.__remoteApp.runAutoPolicyHarness();
          console.log(JSON.stringify(policy,null,2));
          if(!policy || policy.ok!==true) process.exit(1);
          const policyRequired=[
            'POLICY_T01_GLOBAL_DEFAULT',
            'POLICY_T02_PROFILE_OVERRIDE',
            'POLICY_T03_GROUP_OVERRIDE',
            'POLICY_T04_INVALID_REJECTED',
            'POLICY_T05_OUTSIDE_ACTIVE_HOURS',
            'POLICY_T06_MANUAL_RUN_OUTSIDE_WINDOW',
            'POLICY_T07_COMMENT_OFF_OTHER_LANES_RUN',
            'POLICY_T08_SIGNAL_CONTEXT_MISSING',
            'POLICY_T09_QUALIFICATION_REQUIRES_POLICY',
            'POLICY_T10_HUMAN_APPROVAL_NO_EXTERNAL_ACTION',
            'POLICY_T11_HF9_CARDINALITY',
            'POLICY_T12_LEASE_ISOLATION'
          ];
          for(const k of policyRequired){
            if(policy.tests[k]!==true) throw new Error('policy acceptance failed: '+k);
          }
          const leases=sandbox.__remoteApp.runConcurrencyLeaseHarness();
          console.log(JSON.stringify(leases,null,2));
          if(!leases || leases.ok!==true) process.exit(1);
          for(const k of ['AI_SINGLE_LEASE','AUTO_SINGLE_LEASE','COMMENT_SAME_POST_BLOCKED','COMMENT_DIFFERENT_POST_PARALLEL']){
            if(leases.tests[k]!==true) throw new Error('lease acceptance failed: '+k);
          }
          NODE

      - name: Assert manual and Due scopes cannot cross
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          runtime = Path('apps-script/Runtime.js').read_text(encoding='utf-8')
          ui = Path('apps-script/ImportDialog.html').read_text(encoding='utf-8')
          bootstrap = Path('bootstrap/Code.gs').read_text(encoding='utf-8')

          required_runtime = [
              "UI_CONTRACT: 'scan-scope-v2'",
              "PREPARE_SELECTED_WORKER_BATCH",
              "scope:'SCHEDULER_DUE'",
              "'CHECKBOX_SELECTION'",
              "SCAN_SCOPE_INVALID",
              "UI_RUNTIME_CONTRACT_MISMATCH",
          ]
          for token in required_runtime:
              assert token in runtime, f'missing runtime security token: {token}'

          assert 'content="scan-scope-v2"' in ui
          assert "command({__command:'PREPARE_SELECTED_WORKER_BATCH'" in ui
          assert "command({__command:'PREPARE_DUE_WORKER_BATCH'" in ui
          assert "plan.scope!=='CHECKBOX_SELECTION'" in ui
          assert "plan.scope!=='SCHEDULER_DUE'" in ui
          assert 'SCAN_SCOPE_MISMATCH' in ui

          selected_start = ui.index('function runCheckedGroups()')
          selected_end = ui.index('function retryFailedGroups()', selected_start)
          selected_block = ui[selected_start:selected_end]
          assert 'PREPARE_DUE_WORKER_BATCH' not in selected_block, 'manual selected scan must never call Due Queue'

          selected_backend_start = runtime.index('function getCheckedGroupRows_()')
          selected_backend_end = runtime.index('function groupPriorityRank_', selected_backend_start)
          selected_backend = runtime[selected_backend_start:selected_backend_end]
          assert ("r[22]===true" in selected_backend or "r[22]!==true" in selected_backend), 'manual selected backend must be checkbox-driven'
          for forbidden in ['CẦN QUÉT', 'dueText', 'nextAt', 'getDueGroupRows_', 'isDueJobStillValid_']:
              assert forbidden not in selected_backend, f'manual selected backend must not read Due state: {forbidden}'

          worker_start = runtime.index('function runWorkerJob_(')
          worker_end = runtime.index('function sortOpportunityNewestFirst_', worker_start)
          worker_block = runtime[worker_start:worker_end]
          assert "const requireDue=jobMode==='due' || command.requireDue===true;" in worker_block, 'manual Due and Auto Due must share the same execution guard'
          assert "if(requireDue && !isDueJobStillValid_(sheet,row))" in worker_block, 'Due recheck must happen immediately before Worker execution'
          assert worker_block.count('isDueJobStillValid_') == 1, 'Worker must have exactly one canonical Due recheck'
          assert "SKIP_DUPLICATE" in worker_block, 'stale duplicate jobs must fail closed before FBAIO'
          assert "SKIP_INACTIVE" in worker_block, 'inactive audit rows must fail closed before FBAIO'
          assert "resolveCanonicalGroupRow_(sheet,row)" in worker_block, 'worker must resolve canonical identity before FBAIO'

          retry_start = runtime.index('function collectRetryJobs_()')
          retry_end = runtime.index('function prepareJobsForWorkers_', retry_start)
          retry_block = runtime[retry_start:retry_end]
          assert "duplicateRows" in retry_block and "getDuplicateGroupIdentityRows_" in retry_block, 'manual retry must exclude duplicate rows'

          assert "selectedFromRows" in selected_backend
          assert "canonicalizedFromDuplicate" in selected_backend
          assert "repairSelectedDuplicateRows_" in selected_backend
          assert "DUPLICATE_SELECTION_REDIRECT" in runtime

          historic_start = runtime.index('function historicNumericGroupIdFromRow_(')
          historic_end = runtime.index('function logRuntimeApiEvent_', historic_start)
          historic_block = runtime[historic_start:historic_end]
          assert "siblings=sh.getRange" in historic_block, 'numeric alias fallback must search sibling canonical rows'
          assert "identityKey=exactGroupKeyFromRow_" in historic_block

          due_start = ui.index('function runDueGroups(')
          due_end = ui.index('function analyzeSourceIdsSequential', due_start)
          due_block = ui[due_start:due_end]
          assert 'PREPARE_SELECTED_WORKER_BATCH' not in due_block, 'Due Queue must never call checkbox-selected scan'

          assert "BOOTSTRAP_VERSION = '2.4.1-auto-monitor-auth'" in bootstrap
          assert "cache.remove('SOCIAL_AIO_REMOTE_RUNTIME')" in bootstrap
          assert "cache.remove('SOCIAL_AIO_REMOTE_HTML')" in bootstrap
          assert "loadRemoteApp_(freshUi === true)" in bootstrap
          assert "function authorizeAutoMonitor()" in bootstrap

          required_fbaio = [
              "isGroupIdentityResolveError_",
              "historicNumericGroupIdFromRow_",
              "NUMERIC_GROUP_ID_FALLBACK",
              "PREEMPTIVE_NUMERIC_GROUP_ID",
              "R_NUMERIC_ALIAS_PREEMPT",
              "R_NUMERIC_FALLBACK_PASS",
              "GROUP_ID_RESOLVE",
              "socialAioRaw",
          ]
          for token in required_fbaio:
              assert token in runtime, f'missing FBAIO fallback token: {token}'
          assert "apiParams=" in runtime
          assert "fallbackParams=" in runtime
          assert "apiParams:err.apiParams" in runtime

          keeper = Path('worker-keeper/content.js').read_text(encoding='utf-8')
          manifest = Path('worker-keeper/manifest.json').read_text(encoding='utf-8')
          assert "E_FB_GROUP_ID_RESOLVE" in keeper
          assert "Wrong ID" in keeper
          assert "identityResolveActive" in keeper
          assert '"version": "1.2.2"' in manifest

          assert "TIME_BUDGET" in runtime
          assert "duplicateRows=new Set(getDuplicateGroupIdentityRows_()" in runtime

          normalize_start = runtime.index('function normalizeGroupTarget_(')
          normalize_end = runtime.index('function callGroupPostsRawOnce_', normalize_start)
          normalize_block = runtime[normalize_start:normalize_end]
          assert "Math.min(200,n)" in normalize_block
          assert "if(n<=10)" not in normalize_block
          assert "if(n<=15)" not in normalize_block
          assert "if(n<=20)" not in normalize_block

          assert '<input id="groupTarget" type="number"' in ui
          assert 'value="25"' in ui
          assert 'min="1"' in ui and 'max="200"' in ui
          assert '<select id="groupTarget">' not in ui
          # Manual scan target must remain free numeric input; discovery copy may legitimately say "10 bài".
          assert not re.search(r'<option[^>]*>\s*(10|15|20|25)\s*bài\s*</option>', ui), 'manual fixed scan target options must remain removed'

          assert "requireNumberBetween(1,200)" in runtime
          assert "requireValueInList(['10','15','20','25']" not in runtime

          assert "Numeric ID " in runtime
          assert "result.fallbackUsed?('ID fallback '" not in runtime
          assert "let status='XONG';\n      let note='';" in runtime
          assert "let status='XONG', note='';" in runtime
          assert "FBAIO vanity Group bị parse sai; đã chuyển sang numeric ID" not in runtime

          assert "function buildCanonicalGroupIndex_(" in runtime
          assert "function resolveCanonicalGroupRow_(" in runtime
          active_start = runtime.index('function scanGroupRowApiBridge_(')
          active_end = runtime.index('function getCheckedGroupRows_()', active_start)
          active_block = runtime[active_start:active_end]
          assert "resolveCanonicalGroupRow_(sheet,requestedRow)" in active_block
          assert "redirectedFromRow" in active_block
          assert "INACTIVE_NO_CANONICAL" in active_block

          selected_start_backend = runtime.index('function getCheckedGroupRows_()')
          selected_end_backend = runtime.index('function groupPriorityRank_', selected_start_backend)
          selected_block_backend = runtime[selected_start_backend:selected_end_backend]
          assert "canonicalIndex=buildCanonicalGroupIndex_(sheet)" in selected_block_backend
          assert "resolveCanonicalGroupRow_(sheet,selectedRow,canonicalIndex)" in selected_block_backend

          retry_start = runtime.index('function collectRetryJobs_()')
          retry_end = runtime.index('function prepareJobsForWorkers_', retry_start)
          retry_block = runtime[retry_start:retry_end]
          assert "String(r[0]||'').trim()!=='Có'" in retry_block

          assert "status:'SKIP_INACTIVE'" in worker_block
          assert "resolveCanonicalGroupRow_(sheet,row)" in worker_block
          assert "command.requireDue===true" in worker_block

          assert "function getAutoMonitorTriggerAccess_(" in runtime
          assert "permissionOk:false" in runtime
          assert "AUTO_AUTH_REQUIRED" in runtime
          assert "RUN_AUTO_MONITOR_TEST" in runtime
          assert "testMode:true,maxJobs:1,skipComments:true,skipAi:true" in runtime
          assert "Never persist ON before the installable trigger is known-good." in runtime
          assert "summary.jobResults.push" in runtime
          assert "summary.queue.selected" in runtime

          due_valid_start = runtime.index('function isDueJobStillValid_(')
          due_valid_end = runtime.index('function callSocialAioApiWithClient_', due_valid_start)
          due_valid = runtime[due_valid_start:due_valid_end]
          assert "nextAt<=Date.now()" in due_valid
          assert "status==='LỖI'" in due_valid and "status==='THIẾU'" in due_valid

          assert "🧪 TEST 1 CYCLE" not in ui
          assert "function testAutoMonitorCycle()" not in ui
          assert "function runAutoMonitorNow()" in ui
          assert "RUN_AUTO_MONITOR_NOW" in ui
          assert "▶ CHẠY NGAY 1 CYCLE" in ui
          assert 'onclick="runDueGroups(false)"' not in ui
          assert "RUN_AUTO_MONITOR_TEST" in runtime  # hidden support diagnostic retained

          assert "VERSION: '1.9.8.7-HF10.7-display-fallback-closure'" in runtime
          assert "CONTEXT_REQUIRED" in runtime
          assert "LEAD_LEGACY_ARCHIVE_SHEET" in runtime
          assert "OPPORTUNITY_TOTAL_COLS: 32" in runtime
          assert "OPPORTUNITY_GROUP_KEY_COL: 32" in runtime
          assert "OFFER_CONTEXT_FIELDS: ['OFFER','BUYER','PROBLEM','PRODUCT-SERVICE','VALUE','QUALIFICATION','CTA']" in runtime
          assert "SALES_STAGE_OPTIONS" in runtime
          assert "GET_SALES_RECOVERY_QUEUE" in runtime
          assert "SET_SELECTED_SALES_STAGE" in runtime
          assert "function canSetSalesStage_(" in runtime
          assert "function isSalesStageTransitionAllowed_(" in runtime
          assert "function salesTransitionReason_(" in runtime
          assert "function nextFollowUpForSalesStage_(" in runtime
          assert "AUTO_POLICY_KEY: 'SOCIAL_AIO_AUTO_POLICY_V1'" in runtime
          assert "function resolveEffectiveScanPolicy_(" in runtime
          assert "function resolveEffectiveCommentPolicy_(" in runtime
          assert "function resolveEffectiveAiPolicy_(" in runtime
          assert "function resolveEffectiveActionPolicy_(" in runtime
          assert "function runGroupOnboardingHarness_(" in runtime
          assert "function runGroupIntelligenceHarness_(" in runtime
          assert "function ingestApiRecords_(" in runtime
          assert "function runApiNativeCleanupHarness_(" in runtime
          assert "function repairVerifiedIdentityQuarantineOnce_(" in runtime
          assert "function runVerifiedIdentityRetryHarness_(" in runtime
          assert "GROUP_IDENTITY_RETRY_PREFIX" in runtime
          assert "historicNumericGroupIdFromRow_(" in runtime
          assert "skippedAttempted" in runtime
          assert "idRetry=" in runtime
          assert "parsed:list" in runtime
          assert "Object.prototype.hasOwnProperty.call(file,'parsed')" in runtime
          assert "function measureGroupActivityWindow_(" in runtime
          assert "GROUP_SUMMARY_LEGACY_ARCHIVE_SHEET: 'NHÓM LEGACY ARCHIVE'" in runtime
          assert "'Members — FB REPORTED'" in runtime
          assert "'Post 24h — FB REPORTED'" in runtime
          assert "'Post 24h — OBSERVED'" in runtime
          assert "'Avg Posts/day 7d — OBSERVED'" in runtime
          assert "activity.complete24h?Number(activity.post24hObserved||0):''" in runtime
          assert "activity.complete7d?Number(activity.avgPostsDay7dObserved||0):''" in runtime
          assert "validateOfferContext_(s[26]).valid" in runtime
          assert "function normalizeFacebookGroupInput_(" in runtime
          assert "function prepareOnboardingWorkerBatch_(" in runtime
          assert "function evaluateGroupDiscovery_(" in runtime
          assert "groupPlaceholderName_()==='CHƯA LẤY TÊN'" in runtime
          assert "function normalizeGroupDisplayName_(" in runtime
          assert "function rebuildGroupAliasRegistryFromEvidence_(" in runtime
          assert "setNumberFormat('@')" in runtime
          assert "name = 'Group ' + gid" not in runtime
          assert "setValue('Group ' + key)" not in runtime
          assert "`Group ${groupKey" not in runtime
          assert "('Group '+String(r[4]||''))" not in runtime
          assert "targetCount:10" in runtime
          assert "'ONBOARDING_DISCOVERY'" in runtime
          assert "offerInferred:false" in runtime
          assert "postsPerDayInferred:false" in runtime
          assert "function runAutoPolicyHarness_(" in runtime
          assert "function runConcurrencyLeaseHarness_(" in runtime
          assert "HH:mm hợp lệ" in runtime
          assert "p@" in runtime
          assert "AUTO_COMMENT_LOCKED_HF10" in runtime
          assert "externalExecutionAllowed:false" in runtime
          assert "policy.trigger=" in runtime
          assert "policy.window=" in runtime
          assert "policy.scan=" in runtime
          assert "policy.comment=" in runtime
          assert "policy.ai=" in runtime
          registry_start = runtime.index('function buildCanonicalGroupSummaryRegistry_(')
          summary_start = runtime.index('function refreshGroupSummary_(')
          summary_end = runtime.index('function refreshCoordination_', summary_start)
          registry_block = runtime[registry_start:summary_start]
          summary_block = runtime[summary_start:summary_end]
          assert "aliasOwner=new Map()" in registry_block
          assert "canonicalGroupKeyAliasesFromScanRow_(s,idx+2)" in registry_block
          assert "if(a.active!==b.active) return a.active?-1:1" in registry_block
          assert "function buildGroupSummaryOpportunityIndex_(" in registry_block
          assert "if(!key) return; // fail closed: identityMissing never joins by display name" in registry_block
          assert "function collectGroupSummaryOpportunities_(" in registry_block
          assert "seenSourceIds" in registry_block
          assert "function runGroupSummaryCardinalityHarness_(" in registry_block
          assert "function buildGroupRegistryCleanupPlan_(" in registry_block
          assert "GROUP_ALIAS_REGISTRY_SHEET" in runtime
          assert "function cleanGroupRegistryCanonicalOnce_(" in runtime
          assert "PHYSICAL_DUPLICATE_MERGE" in runtime
          assert "sh.deleteRow(row)" in runtime
          assert "buildCanonicalGroupSummaryRegistry_(scanRows)" in summary_block
          assert "collectGroupSummaryOpportunities_(byGroupKey,group.aliases)" in summary_block
          assert "String(r[26]||'').trim()==='Đã bán'" in registry_block
          assert "String(r[17]||'').trim()==='Đã bán'" not in registry_block
          assert "byGroup[name]" not in summary_block
          sales_start = runtime.index('function setSelectedOpportunitySalesStage_(')
          sales_end = runtime.index('function getSalesPipelineStats_', sales_start)
          sales_block = runtime[sales_start:sales_end]
          assert "stage!=='Lost'" not in sales_block
          assert "canSetSalesStage_(gate,alreadyInSales)" in sales_block
          assert "isSalesStageTransitionAllowed_(gate,alreadyInSales,stage)" in sales_block
          assert "skipReasons" in sales_block
          assert "existingConversions=sh.getRange(start,18,n,1).getValues()" in sales_block
          assert "sh.getRange(start+i,18).getValue()" not in sales_block
          assert "nextFollowUpForSalesStage_(stage,nextFollow,prev[2])" in sales_block
          apply_ai_start = runtime.index('function applyAiAnalysis_(')
          apply_ai_end = runtime.index('function normalizeAndDedupeCommentSheet_', apply_ai_start)
          apply_ai_block = runtime[apply_ai_start:apply_ai_end]
          assert "const sourceId=x.sourceId;" in apply_ai_block
          assert "ownPostSourceMap[sourceId]" in apply_ai_block
          assert "function validateOfferContext_(" in runtime
          assert "function loadValidatedGroupContexts_(" in runtime
          assert "function buildSourceGroupKeyMap_(" in runtime
          assert "function backfillOpportunityGroupKeys_(" in runtime
          assert "function identityKeyFromCell_(" in runtime
          assert "function normalizeIdentityColumnToText_(" in runtime
          assert "function normalizeGroupRegistryIdentityText_(" in runtime
          assert "function runContextIntegrityHarness_(" in runtime
          assert "function decideLeadGate_(" in runtime
          assert "'Sales Stage','Last Contact','Next Follow-up','Owner','Outcome / Value','Group Key'" in runtime

          readiness_start = runtime.index('function getContextReadiness_(')
          readiness_end = runtime.index('function saveActiveGroupContext_', readiness_start)
          readiness_block = runtime[readiness_start:readiness_end]
          assert "loadValidatedGroupContexts_()" in readiness_block
          assert "missingFields" in readiness_block

          save_ctx_start = runtime.index('function saveActiveGroupContext_(')
          save_ctx_end = runtime.index('function buildSourceGroupKeyMap_', save_ctx_start)
