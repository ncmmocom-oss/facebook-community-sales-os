name: Security Regression Gate

on:
  pull_request:
    paths:
      - 'apps-script/**'
      - 'bootstrap/**'
      - 'worker-keeper/**'
      - '.github/workflows/security-regression.yml'
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - 'bootstrap/**'
      - 'worker-keeper/**'
      - '.github/workflows/security-regression.yml'

permissions:
  contents: read

jobs:
  scan-scope-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          cp apps-script/Runtime.js /tmp/runtime.js
          node --check /tmp/runtime.js
          cp bootstrap/Code.gs /tmp/bootstrap.js
          node --check /tmp/bootstrap.js
          node --check worker-keeper/background.js
          node --check worker-keeper/content.js
          node --check worker-keeper/popup.js

      - name: Assert manual and Due scopes cannot cross
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('apps-script/Runtime.js').read_text(encoding='utf-8')
          ui = Path('apps-script/ImportDialog.html').read_text(encoding='utf-8')
          bootstrap = Path('bootstrap/Code.gs').read_text(encoding='utf-8')

          required_runtime = [
              "UI_CONTRACT: 'scan-scope-v2'",
              "PREPARE_SELECTED_WORKER_BATCH",
              "scope:'SCHEDULER_DUE'",
              "'CHECKBOX_SELECTION'",
              "SCAN_SCOPE_INVALID",
              "UI_RUNTIME_CONTRACT_MISMATCH",
          ]
          for token in required_runtime:
              assert token in runtime, f'missing runtime security token: {token}'

          assert 'content="scan-scope-v2"' in ui
          assert "command({__command:'PREPARE_SELECTED_WORKER_BATCH'" in ui
          assert "command({__command:'PREPARE_DUE_WORKER_BATCH'" in ui
          assert "plan.scope!=='CHECKBOX_SELECTION'" in ui
          assert "plan.scope!=='SCHEDULER_DUE'" in ui
          assert 'SCAN_SCOPE_MISMATCH' in ui

          selected_start = ui.index('function runCheckedGroups()')
          selected_end = ui.index('function retryFailedGroups()', selected_start)
          selected_block = ui[selected_start:selected_end]
          assert 'PREPARE_DUE_WORKER_BATCH' not in selected_block, 'manual selected scan must never call Due Queue'

          selected_backend_start = runtime.index('function getCheckedGroupRows_()')
          selected_backend_end = runtime.index('function groupPriorityRank_', selected_backend_start)
          selected_backend = runtime[selected_backend_start:selected_backend_end]
          assert ("r[22]===true" in selected_backend or "r[22]!==true" in selected_backend), 'manual selected backend must be checkbox-driven'
          for forbidden in ['CẦN QUÉT', 'dueText', 'nextAt', 'getDueGroupRows_', 'isDueJobStillValid_']:
              assert forbidden not in selected_backend, f'manual selected backend must not read Due state: {forbidden}'

          worker_start = runtime.index('function runWorkerJob_(')
          worker_end = runtime.index('function sortOpportunityNewestFirst_', worker_start)
          worker_block = runtime[worker_start:worker_end]
          due_guard = "if(jobMode==='due' && !isDueJobStillValid_(sheet,row))"
          assert due_guard in worker_block, 'Due recheck must be guarded by jobMode===due'
          assert worker_block.count('isDueJobStillValid_') == 1, 'selected/retry/auto must not inherit extra Due checks'
          assert "SKIP_DUPLICATE" in worker_block, 'stale duplicate jobs must fail closed before FBAIO'
          assert "repairDuplicateRegistryRow_" in worker_block, 'worker must repair stale duplicate registry rows'

          retry_start = runtime.index('function collectRetryJobs_()')
          retry_end = runtime.index('function prepareJobsForWorkers_', retry_start)
          retry_block = runtime[retry_start:retry_end]
          assert "duplicateRows" in retry_block and "getDuplicateGroupIdentityRows_" in retry_block, 'manual retry must exclude duplicate rows'

          assert "selectedFromRows" in selected_backend
          assert "canonicalizedFromDuplicate" in selected_backend
          assert "repairSelectedDuplicateRows_" in selected_backend
          assert "DUPLICATE_SELECTION_REDIRECT" in runtime
          assert "STALE_DUPLICATE_JOB_BLOCKED" in runtime

          historic_start = runtime.index('function historicNumericGroupIdFromRow_(')
          historic_end = runtime.index('function logRuntimeApiEvent_', historic_start)
          historic_block = runtime[historic_start:historic_end]
          assert "siblings=sh.getRange" in historic_block, 'numeric alias fallback must search sibling canonical rows'
          assert "identityKey=exactGroupKeyFromRow_" in historic_block

          due_start = ui.index('function runDueGroups(')
          due_end = ui.index('function analyzeSourceIdsSequential', due_start)
          due_block = ui[due_start:due_end]
          assert 'PREPARE_SELECTED_WORKER_BATCH' not in due_block, 'Due Queue must never call checkbox-selected scan'

          assert "BOOTSTRAP_VERSION = '2.3-runtime-ui-atomic'" in bootstrap
          assert "cache.remove('SOCIAL_AIO_REMOTE_RUNTIME')" in bootstrap
          assert "cache.remove('SOCIAL_AIO_REMOTE_HTML')" in bootstrap
          assert "loadRemoteApp_(freshUi === true)" in bootstrap

          required_fbaio = [
              "isGroupIdentityResolveError_",
              "historicNumericGroupIdFromRow_",
              "NUMERIC_GROUP_ID_FALLBACK",
              "PREEMPTIVE_NUMERIC_GROUP_ID",
              "R_NUMERIC_ALIAS_PREEMPT",
              "R_NUMERIC_FALLBACK_PASS",
              "GROUP_ID_RESOLVE",
              "socialAioRaw",
          ]
          for token in required_fbaio:
              assert token in runtime, f'missing FBAIO fallback token: {token}'

          keeper = Path('worker-keeper/content.js').read_text(encoding='utf-8')
          manifest = Path('worker-keeper/manifest.json').read_text(encoding='utf-8')
          assert "E_FB_GROUP_ID_RESOLVE" in keeper
          assert "Wrong ID" in keeper
          assert "identityResolveActive" in keeper
          assert '"version": "1.2.2"' in manifest

          assert "TIME_BUDGET" in runtime
          assert "duplicateRows=new Set(getDuplicateGroupIdentityRows_()" in runtime

          normalize_start = runtime.index('function normalizeGroupTarget_(')
          normalize_end = runtime.index('function callGroupPostsRawOnce_', normalize_start)
          normalize_block = runtime[normalize_start:normalize_end]
          assert "Math.min(200,n)" in normalize_block
          assert "if(n<=10)" not in normalize_block
          assert "if(n<=15)" not in normalize_block
          assert "if(n<=20)" not in normalize_block

          assert '<input id="groupTarget" type="number"' in ui
          assert 'value="25"' in ui
          assert 'min="1"' in ui and 'max="200"' in ui
          assert '<select id="groupTarget">' not in ui
          for fixed in ['10 bài','15 bài','20 bài','25 bài</option>']:
              assert fixed not in ui, f'fixed scan target option must be removed: {fixed}'

          assert "requireNumberBetween(1,200)" in runtime
          assert "requireValueInList(['10','15','20','25']" not in runtime

          assert "Numeric ID " in runtime
          assert "ID fallback " not in runtime
          assert "let status='XONG';\n      let note='';" in runtime
          assert "let status='XONG', note='';" in runtime
          assert "FBAIO vanity Group bị parse sai; đã chuyển sang numeric ID" not in runtime

          print('scan-scope + FBAIO identity + Auto Monitor + custom target + success-note contract OK')
          PY

      - name: Reject obvious secret material
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.md' '(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' apps-script bootstrap worker-keeper; then
            echo 'Potential secret material detected.'
            exit 1
          fi
